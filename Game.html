<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders JavaScript</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 20px #0ff;
        }
        #gameOver {
            position: absolute;
            color: white;
            font-size: 48px;
            text-align: center;
            display: none;
        }
        #startScreen {
            position: absolute;
            color: white;
            text-align: center;
        }
        #scoreDisplay {
            position: absolute;
            top: 20px;
            color: white;
            font-size: 24px;
        }
        button {
            background-color: #0ff;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0dd;
        }
    </style>
</head>
<body>
    <div id="scoreDisplay">Score: 0</div>
    <canvas id="gameCanvas" width="600" height="700"></canvas>
    
    <div id="startScreen">
        <h1>SPACE INVADERS</h1>
        <p>Use arrow keys to move and spacebar to shoot</p>
        <button id="startButton">START GAME</button>
    </div>
    
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p id="finalScore">Score: 0</p>
        <button id="restartButton">PLAY AGAIN</button>
    </div>

    <script>
        // Game constants
        const PLAYER_WIDTH = 50;
        const PLAYER_HEIGHT = 30;
        const PLAYER_SPEED = 8;
        const BULLET_SPEED = 7;
        const ENEMY_ROWS = 5;
        const ENEMY_COLS = 10;
        const ENEMY_WIDTH = 40;
        const ENEMY_HEIGHT = 30;
        const ENEMY_PADDING = 20;
        const ENEMY_MARGIN_TOP = 60;
        const ENEMY_MARGIN_LEFT = 30;
        const ENEMY_DROP_DISTANCE = 20;

        // Game variables
        let canvas, ctx;
        let player = {
            x: 0,
            y: 0,
            width: PLAYER_WIDTH,
            height: PLAYER_HEIGHT,
            speed: PLAYER_SPEED,
            color: '#0ff'
        };
        
        let bullets = [];
        let enemies = [];
        let enemyDirection = 1;
        let enemySpeed = 1;
        let enemyMoveDown = false;
        let score = 0;
        let gameOver = false;
        let gameStarted = false;
        let animationId;
        let lastEnemyMoveTime = 0;
        let enemyMoveInterval = 1000; // milliseconds

        // Initialize the game
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // Set player initial position
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - player.height - 20;
            
            // Set up event listeners
            document.addEventListener('keydown', keyDownHandler);
            document.addEventListener('keyup', keyUpHandler);
            document.getElementById('startButton').addEventListener('click', startGame);
            document.getElementById('restartButton').addEventListener('click', restartGame);
            
            // Draw the start screen
            drawStartScreen();
        }

        // Draw the start screen
        function drawStartScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Start the game
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameStarted = true;
            gameOver = false;
            score = 0;
            document.getElementById('scoreDisplay').textContent = 'Score: 0';
            
            // Create enemies
            createEnemies();
            
            // Start the game loop
            gameLoop();
        }

        // Restart the game
        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            bullets = [];
            enemies = [];
            enemyDirection = 1;
            enemySpeed = 1;
            startGame();
        }

        // Create enemy grid
        function createEnemies() {
            enemies = [];
            
            for (let row = 0; row < ENEMY_ROWS; row++) {
                for (let col = 0; col < ENEMY_COLS; col++) {
                    const enemyX = col * (ENEMY_WIDTH + ENEMY_PADDING) + ENEMY_MARGIN_LEFT;
                    const enemyY = row * (ENEMY_HEIGHT + ENEMY_PADDING) + ENEMY_MARGIN_TOP;
                    
                    enemies.push({
                        x: enemyX,
                        y: enemyY,
                        width: ENEMY_WIDTH,
                        height: ENEMY_HEIGHT,
                        color: row === 0 ? '#f00' : row < 3 ? '#ff0' : '#0f0'
                    });
                }
            }
        }

        // Main game loop
        function gameLoop() {
            if (gameOver) {
                endGame();
                return;
            }
            
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update game objects
            updatePlayer();
            updateBullets();
            updateEnemies();
            
            // Draw game objects
            drawPlayer();
            drawBullets();
            drawEnemies();
            
            // Check for collisions
            checkCollisions();
            
            // Continue the game loop
            animationId = requestAnimationFrame(gameLoop);
        }

        // Update player position based on input
        function updatePlayer() {
            if (rightPressed && player.x < canvas.width - player.width) {
                player.x += player.speed;
            } else if (leftPressed && player.x > 0) {
                player.x -= player.speed;
            }
        }

        // Draw the player
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Draw player ship details
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y - 10);
            ctx.lineTo(player.x + 10, player.y + player.height / 2);
            ctx.lineTo(player.x + player.width - 10, player.y + player.height / 2);
            ctx.closePath();
            ctx.fill();
        }

        // Update bullets position
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                
                // Remove bullets that are off screen
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        // Draw bullets
        function drawBullets() {
            ctx.fillStyle = '#ff0';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
        }

        // Update enemies position
        function updateEnemies() {
            const currentTime = Date.now();
            
            if (currentTime - lastEnemyMoveTime > enemyMoveInterval) {
                let moveDown = false;
                let hitEdge = false;
                
                // Check if any enemy has hit the edge
                for (const enemy of enemies) {
                    if ((enemy.x + enemy.width + enemyDirection * enemySpeed > canvas.width) || 
                        (enemy.x + enemyDirection * enemySpeed < 0)) {
                        hitEdge = true;
                        break;
                    }
                }
                
                if (hitEdge) {
                    enemyDirection *= -1;
                    moveDown = true;
                }
                
                // Move enemies
                for (const enemy of enemies) {
                    enemy.x += enemyDirection * enemySpeed;
                    if (moveDown) {
                        enemy.y += ENEMY_DROP_DISTANCE;
                        
                        // Check if enemies reached the bottom
                        if (enemy.y + enemy.height >= player.y) {
                            gameOver = true;
                        }
                    }
                }
                
                lastEnemyMoveTime = currentTime;
                
                // Gradually increase enemy speed
                if (enemies.length > 0) {
                    enemyMoveInterval = Math.max(100, 1000 - (score / 10));
                }
            }
        }

        // Draw enemies
        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                
                // Draw enemy details
                ctx.fillStyle = '#000';
                ctx.fillRect(enemy.x + 5, enemy.y + 5, 10, 10);
                ctx.fillRect(enemy.x + enemy.width - 15, enemy.y + 5, 10, 10);
                ctx.fillRect(enemy.x + enemy.width / 2 - 5, enemy.y + enemy.height - 15, 10, 10);
            });
        }

        // Check for collisions between bullets and enemies
        function checkCollisions() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (isColliding(bullets[i], enemies[j])) {
                        // Remove bullet and enemy
                        bullets.splice(i, 1);
                        enemies.splice(j, 1);
                        
                        // Increase score
                        score += 10;
                        document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
                        
                        // Check if all enemies are defeated
                        if (enemies.length === 0) {
                            // Next level - faster enemies
                            enemySpeed += 0.5;
                            createEnemies();
                        }
                        
                        break;
                    }
                }
            }
        }

        // Check if two objects are colliding
        function isColliding(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }

        // End the game
        function endGame() {
            cancelAnimationFrame(animationId);
            document.getElementById('finalScore').textContent = `Score: ${score}`;
            document.getElementById('gameOver').style.display = 'block';
        }

        // Keyboard input handling
        let rightPressed = false;
        let leftPressed = false;
        let spacePressed = false;

        function keyDownHandler(e) {
            if (!gameStarted || gameOver) return;
            
            if (e.key === 'Right' || e.key === 'ArrowRight') {
                rightPressed = true;
            } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                leftPressed = true;
            } else if (e.key === ' ' && !spacePressed) {
                spacePressed = true;
                // Fire bullet
                bullets.push({
                    x: player.x + player.width / 2 - 2,
                    y: player.y,
                    width: 4,
                    height: 10,
                    speed: BULLET_SPEED
                });
            }
        }

        function keyUpHandler(e) {
            if (e.key === 'Right' || e.key === 'ArrowRight') {
                rightPressed = false;
            } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                leftPressed = false;
            } else if (e.key === ' ') {
                spacePressed = false;
            }
        }

        // Start the game when the page loads
        window.onload = init;
    </script>
</body>
</html>
